# Generated cases per property. High enough that a rare candidate-set shape still shows
# up, low enough that the suite stays inside a few seconds.
jqwik.tries.default=2000

# Re-run the seed that failed last time before exploring new ones, so a fix is confirmed
# against the exact counterexample that exposed the bug.
jqwik.database=.jqwik-database
jqwik.failures.after.default=PREVIOUS_SEED

# Report the generated distribution on demand when a property looks suspiciously green.
jqwik.reporting.usejunitplatformreporter=false
